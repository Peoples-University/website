title: Cinema & Struggle
intro: Film screenings and political discussion, organized by the People’s University Project.
membership_note: The committee’s tasks are tentative and can develop with the group.
tasks:
  - Selecting movies to be watched.
  - Curating discussion questions.
  - Promoting the events.
  - Creating graphics and posters.
  - Working with the People’s University committee to assess the direction of the events.
suggestions:
  - Write and publish reviews or screening notes reflecting on the discussion, including attendees’ responses and memorable quotes.
  - Make playbill-style handouts with film production details, information about the director, and spoiler-free themes and discussion questions.
