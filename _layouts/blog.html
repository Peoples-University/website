<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" href="https://raw.githubusercontent.com/Peoples-University/website/refs/heads/main/assets/PUP%20Logo2.png">
    <title>{{ page.title }} | The People's University Project</title>
</head>

<body>

    <!-- =========== NAV ===========-->
    <div class="container-fluid pt-3 pb-3 fixed-top navbar">

        <div class="text-center">
            <a href="{{ site.baseurl }}/" class="site-title-link">
                <div class="site-title" style="color: white;">The People's University Project</div>
            </a>

            <div class="h4 mt-2 nav-buttons">
                <a href="{{ site.baseurl }}/about" class="btn btn-primary nav-btn" role="button">ABOUT</a>
                <a href="{{ site.baseurl }}/journal" class="btn btn-primary nav-btn" role="button">JOURNAL</a>
                <a href="{{ site.baseurl }}/projects" class="btn btn-primary nav-btn" role="button">PROJECTS</a>
                <a href="{{ site.baseurl }}/studies" class="btn btn-primary nav-btn" role="button">STUDIES</a>
            </div>
        </div>

    </div>


    
    <!-- =========== PAGE CONTENT =========== -->
     <div class="container mt-3">
        {{ content }}
    </div>

<script>
function adjustNavPadding() {
    const nav = document.querySelector('.fixed-top');
    const navHeight = nav.offsetHeight;
    document.body.style.paddingTop = navHeight + 'px';
}
window.addEventListener('load', adjustNavPadding);
window.addEventListener('resize', adjustNavPadding);
</script>
