---
layout: blog
title: Studies
permalink: /studies/
---

<div class="container mt-3">
    {% assign all_studies = site.studies | sort: "date" | reverse %}

    <div class="site-title mt-4 mb-4 text-center">Studies</div>

    <div class="card-columns mb-5">
        {% for study in all_studies %}
        <div class ="mb-4" style="background-color: #FDD24F; border-radius:5px; break-inside: avoid;">

            <div class="ml-3 mb-3">
                <span style="width:fit-content; background-color: #2b569b; padding:10px; border-radius:5px; color: white;">
                    STUDY
                </span>
            </div>

            <div class="card-title pl-4 pr-4"><a href="{{ study.url | relative_url }}" style="color:#2b569b;">{{ study.title }}</a></div>

            <img src="{{ study.image }}" style="width:100%; aspect-ratio:2/1; object-fit:cover;">

            <div class="p-3">
                <p style="font-weight:bold">Published {{ study.date | date: "%d %B %Y" }}</p>

                <div style="overflow:hidden;" class="mb-3">
                    <div style="overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; line-clamp: 5;">
                        {{ study.summary }}
                    </div>
                </div>

                <a target="_blank" href="{{ study.url | relative_url }}">
                    <u class="h5" style="color:#2b569b">Access study materials here</u>
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
