---
layout: blog
title: Studies
permalink: /studies/
---

<div class="container">
    <div class="h1 mt-4 mb-4 text-center">Studies</div>

    {% assign all_studies = site.studies | sort: "date" | reverse %}

    <div class="row mb-5">
        {% for study in all_studies %}
        <div class="col-12 col-md-6 mb-4">

            <div class="mt-0" style="background-color: #FDD24F; border-radius:5px">

                <div class="ml-3 mb-3"><span style="width:fit-content; background-color: #2b569b; padding:10px; border-radius: 5px 5px 5px 5px; color: white;">STUDY</span></div>

                <!--CARD Title-->
                <div class="h2 pl-4 pr-4 pb-3"><a href="{{ study.url | relative_url }}" style="color:#2b569b;">{{ study.title }}</a></div>

                <!--CARD Picture-->
                <img src="{{ study.image }}" style="width:100%; aspect-ratio:2/1; object-fit:cover;">

                <div class="p-3">
                    <!-- CARD Publishing Date-->
                    <p style="font-weight:bold">Published {{ study.date | date: "%d %B %Y" }}</p>

                    <!--CARD Summary-->
                    <div style="overflow:hidden;" class="mb-3">
                        <div style="overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; line-clamp:5;">
                            {{ study.summary }}
                        </div>
                    </div>

                    <!--CARD Link-->
                    <a target="_blank" href="{{ study.url | relative_url }}">
                        <u class="h5" style="color:#2b569b">Access study resources here</u>
                    </a>
                </div>

            </div>

        </div>
        {% endfor %}
    </div>
</div>
