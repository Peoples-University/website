backend:
  name: github
  repo: Peoples-University/website
  branch: main
  base_url: https://decap-proxy-production-88da.up.railway.app   # from the OAuth proxy step

media_folder: "assets/images"
public_folder: "/website/assets/images"

collections:

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About Page"
        file: "about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Date", name: "date", widget: "datetime" }
          - { label: "Author", name: "author", widget: "string", default: "People's University Committee"}
          - { label: "Body", name: "body", widget: "markdown" }
      - name: "cinema"
        label: "Cinema & Struggle membership"
        file: "_data/cinema.yml"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - { label: "Membership note", name: "membership_note", widget: "text" }
          - { label: "Tentative tasks", name: "tasks", widget: "list", field: { label: "Task", name: "task", widget: "string" } }
          - { label: "Suggested tasks", name: "suggestions", widget: "list", field: { label: "Suggestion", name: "suggestion", widget: "text" } }
          - { label: "Membership document", name: "source_url", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string" }

  - name: "journal-articles"
    label: "Journal Articles"
    folder: "_articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "People's University Committee"}
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "default" }

  - name: "projects"
    label: "Projects"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "People's University"}
      - { label: "Live Demo URL", name: "demo_url", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "quartolayout" }

  - name: "studies"
    label: "Studies"
    folder: "_studies"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "First meeting date", name: "event_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false, hint: "Actual meeting date, not publication date. Adds this study to the calendar." }
      - { label: "Time", name: "time", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Start date has its own session page", name: "calendar_hide_start", widget: "boolean", default: false, required: false, hint: "Prevents duplicate calendar entries." }
      - label: "Additional confirmed meetings"
        name: "sessions"
        widget: "list"
        required: false
        fields:
          - { label: "Meeting date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
          - { label: "Session title", name: "title", widget: "string", required: false }
      - { label: "Author", name: "author", widget: "string", default: "People's University Committee"}
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "default" }
  
  - name: "orgschool"
    label: "Organizer School"
    folder: "_orgschool26"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Unit", name: "unit", widget: "number" }
      - { label: "Week", name: "week", widget: "number" }
      - { label: "Session date", name: "event_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Actual session date, used in the calendar and page heading." }
      - { label: "Legacy date text", name: "datestring", widget: "string", required: false }
      - { label: "Time", name: "time", widget: "string", hint: "Eg: 1pm - 6pm" }
      - { label: "Slide URL", name: "slide_url", widget: "string", hint: "URL to the presentation slides" }
      - { label: "Author", name: "author", widget: "string", default: "People's University Committee"}
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Location", name: "location", widget: "string" }
      - name: "books"
        label: "Reading List"
        widget: "list"
        required: false
        fields:
          - { label: "Reading Title", name: "reading_title", widget: "string" }
          - { label: "Reading Author", name: "reading_author", widget: "string" }
          - { label: "Reading Page Count", name: "reading_pagecount", widget: "number", required: false }
          - { label: "Reading Link", name: "reading_link", widget: "string", required: false }
          - { label: "PDF Link (optional)", name: "reading_pdf", widget: "string", required: false, hint: "Direct PDF URL. Keep Reading Link for the original online text. Links ending in .pdf are detected automatically." }
          - { label: "Web version label", name: "reading_link_label", widget: "string", required: false, hint: "Use this to indicate when the web version is a complete work rather than the assigned excerpt." }
          - { label: "Audio link", name: "reading_audio", widget: "string", required: false, hint: "Google Drive file link or direct audio file URL. Adds a listen/download link and an expandable player." }
          - { label: "Audio note", name: "reading_audio_note", widget: "string", required: false, hint: "Chapter, narrator, or a note about a missing recording." }
      - { label: "Summary", name: "summary", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "os_layout" }

  - name: "events"
    label: "Events & screenings"
    folder: "_events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publication / legacy date", name: "date", widget: "string", required: false, hint: "Not used for the calendar or public event date." }
      - { label: "Event date", name: "event_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Actual event date, not the date you publish the page." }
      - { label: "Series", name: "series", widget: "select", options: [{ label: "Other event", value: "other" }, { label: "Cinema & Struggle", value: "cinema" }], default: "other" }
      - { label: "Time", name: "time", widget: "string", hint: "Eg: 1pm - 6pm" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Calendar Link", name: "calendarlink", widget: "string", required: false }
      - { label: "Registration Link", name: "registerlink", widget: "string", required: false }
      - { label: "Author", name: "author", widget: "string", default: "People's University Committee"}
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Image", name: "image", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "default" }
